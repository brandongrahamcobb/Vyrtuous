groups:
  Sysadmin:
    alias: sysadmin
    default: false
    permissions:
    - '*'
    inheritance:
    - developer
    scope: global
    sysadmin: true
  Developer:
    alias: developer
    default: false
    permissions:
    - command.clear.scope.all
    - command.dev.*
    - command.info.cogs
    - command.info.debug
    - command.info.stats
    - command.utility.*
    - other_guilds
    inheritance:
    - guild_owner
    scope: global
  Guild Owner:
    alias: guild_owner
    default: false
    permissions:
    - command.clear.scope.guild
    - command.info.autoassigns
    - command.info.heroes
    - command.info.streams
    - command.channel.stream
    - command.users.hero
    - command.users.autoassign
    inheritance:
    - administrator
    scope: guild
    guild_owner: true
  Administrator:
    alias: administrator
    default: false
    permissions:
    - command.alias.*
    - command.clear
    - command.clear.category.*
    - command.clear.target.*
    - command.clear.scope.channel
    - command.clear.scope.member
    - command.clear.scope.role
    - command.channel.automute
    - command.channel.cap
    - command.channel.video-channel
    - command.info.automutes
    - command.info.intents
    - command.info.overwrites
    - command.info.scope.guild
    - command.info.voice-mutes.server
    - command.info.video-channels
    - command.moderation.voice-mute.server
    - command.utility.purge
    - command.utility.move
    inheritance:
    - coordinator
    scope: guild
  Coordinator:
    alias: coordinator
    default: false
    permissions:
    - command.info.blacklists
    - command.info.caps
    - command.moderation.blacklist
    - command.moderation.role
    - command.moderation.voice-mute.channel_mute
    - command.moderation.unvoice-mute.channel_unmute
    - command.moderation.uncapped
    - command.users.grant
    - command.users.revoke
    inheritance:
    - moderator
    scope: channel
  Moderator:
    alias: moderator
    default: false
    permissions:
    - command.moderation.ban
    - command.moderation.duration
    - command.moderation.flag
    - command.moderation.reason
    - command.moderation.text-mute
    - command.moderation.voice-mute
    - command.moderation.voice-mute.auto
    - command.moderation.voice-mute.click
    - command.moderation.voice-mute.command
    - command.moderation.unban
    - command.moderation.unflag
    - command.moderation.untext-mute
    - command.moderation.unvoice-mute
    - command.info.aliases
    - command.info.bans
    - command.info.flags
    - command.info.help
    - command.info.roleid
    - command.info.roles
    - command.info.scope.channel
    - command.info.scope.member
    - command.info.scope.role
    - command.info.summary
    - command.info.survey
    - command.info.text-mutes
    - command.info.vegans
    - command.info.voice-mutes
    - command.info.voice-mutes.auto
    - command.info.voice-mutes.click
    - command.info.voice-mutes.command
    - command.utility.delete
    - command.users.vegan
    inheritance:
    - everyone
    scope: channel
  Everyone:
    alias: everyone
    default: true
    scope: global
 


